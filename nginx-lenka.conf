# POST-CUTOVER: This config redirects pzd.whatifai.cz to prozdravedeti.cz.
# Copy to /etc/nginx/sites-available/pzd and reload nginx after DNS cutover.

server {
    listen 443 ssl;
    server_name pzd.whatifai.cz;

    ssl_certificate /etc/letsencrypt/live/pzd.whatifai.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pzd.whatifai.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://prozdravedeti.cz$request_uri;
}

server {
    listen 80;
    server_name pzd.whatifai.cz;
    return 301 https://prozdravedeti.cz$request_uri;
}
