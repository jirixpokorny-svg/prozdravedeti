# Rate limiting zone - max 20 req/s per IP
limit_req_zone $binary_remote_addr zone=pzd_prod_limit:10m rate=20r/s;

# Redirect www → non-www
server {
    listen 80;
    listen 443 ssl;
    server_name www.prozdravedeti.cz;

    ssl_certificate /etc/letsencrypt/live/prozdravedeti.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prozdravedeti.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://prozdravedeti.cz$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name prozdravedeti.cz;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/prozdravedeti.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prozdravedeti.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req zone=pzd_prod_limit burst=50 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    location / {
        proxy_pass http://localhost:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS redirect for prozdravedeti.cz
server {
    listen 80;
    server_name prozdravedeti.cz;
    return 301 https://prozdravedeti.cz$request_uri;
}
